name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: app
        run: npm install

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app/src-tauri
        shell: bash
        run: node -e "const fs=require('fs');const f='tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('version ->',j.version)"

      - name: Build (macOS)
        if: matrix.target == 'macos'
        working-directory: app
        run: npx tauri build --bundles app

      - name: Build CLI binary
        if: matrix.target == 'macos'
        working-directory: app/src-tauri
        run: cargo build --release --bin pushclaw

      - name: Build CLI binary (Windows)
        if: matrix.target == 'windows'
        working-directory: app/src-tauri
        run: cargo build --release --bin pushclaw

      - name: Package macOS .app into zip
        if: matrix.target == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent \
            "app/src-tauri/target/release/bundle/macos/PushClaw.app" \
            "PushClaw-${VERSION}-macos-arm64.zip"
          cp app/src-tauri/target/release/pushclaw "pushclaw-${VERSION}-macos-arm64"
          chmod +x "pushclaw-${VERSION}-macos-arm64"

      - name: Build (Windows)
        if: matrix.target == 'windows'
        working-directory: app
        shell: pwsh
        run: npx tauri build --bundles nsis

      - name: Package Windows artifacts
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v',''
          Write-Host "== target/release 内容 =="
          Get-ChildItem "app/src-tauri/target/release" -Filter "*.exe" | Select-Object Name, Length
          $exe = Get-ChildItem -Path "app/src-tauri/target" -Recurse -Filter "pushclaw.exe" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "pushclaw.exe 未在任何 target 目录中找到" }
          Write-Host "CLI exe: $($exe.FullName) ($($exe.Length) bytes, $($exe.LastWriteTime))"
          Copy-Item $exe.FullName "pushclaw-$v-windows-x64.exe"
          Copy-Item "app/src-tauri/target/release/bundle/nsis/PushClaw_${v}_x64-setup.exe" "PushClaw-${v}-windows-x64-setup.exe"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pushclaw-${{ matrix.target }}
          path: |
            PushClaw-*-macos-arm64.zip
            pushclaw-*-macos-arm64
            PushClaw-*-windows-x64-setup.exe
            pushclaw-*-windows-x64.exe
          if-no-files-found: error

      - name: Create/attach GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PushClaw-*-macos-arm64.zip
            pushclaw-*-macos-arm64
            PushClaw-*-windows-x64-setup.exe
            pushclaw-*-windows-x64.exe
