<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PushClaw</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="hidden">
    <div class="login-card">
      <div class="brand">
        <svg class="claw brand-claw" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><path d="M5 3.2 C5.9 6 6.6 10.5 6.2 15.5 C6 18 5.4 20 4.9 20.8 C4.3 19.6 3.6 16.5 3.7 12.6 C3.8 8.6 4.4 5.2 5 3.2 Z"/><path d="M12 2 C13.1 5.4 13.9 10.6 13.5 16.4 C13.3 19.4 12.6 21.8 12 22.8 C11.3 21.4 10.5 17.7 10.6 13.2 C10.7 8.5 11.4 4.5 12 2 Z"/><path d="M19 3.2 C19.6 5.2 20.2 8.6 20.3 12.6 C20.4 16.5 19.7 19.6 19.1 20.8 C18.6 20 17.9 18 17.8 15.5 C17.4 10.5 18.1 6 19 3.2 Z"/></g></svg>
        <h1>PushClaw</h1>
        <p class="muted">非官方客户端 · 凭据仅存本机</p>
      </div>
      <form id="login-form">
        <label>邮箱<input id="f-email" type="email" required autocomplete="username" /></label>
        <label>密码<input id="f-password" type="password" required autocomplete="current-password" /></label>
        <label>两步验证码
          <input id="f-twofa" type="text" inputmode="numeric" placeholder="可选" /></label>
        <label>设备名<input id="f-device" type="text" value="mac-app" required pattern="[A-Za-z0-9_-]{1,25}" /></label>
        <label>API Token
          <input id="f-token" type="text" placeholder="可选 · pushover.net/apps" autocomplete="off" /></label>
        <div id="login-error" class="error hidden"></div>
        <button id="login-btn" type="submit">登录</button>
      </form>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="main-view" class="hidden">
    <header>
      <div class="brand-row">
        <svg class="claw" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><path d="M5 3.2 C5.9 6 6.6 10.5 6.2 15.5 C6 18 5.4 20 4.9 20.8 C4.3 19.6 3.6 16.5 3.7 12.6 C3.8 8.6 4.4 5.2 5 3.2 Z"/><path d="M12 2 C13.1 5.4 13.9 10.6 13.5 16.4 C13.3 19.4 12.6 21.8 12 22.8 C11.3 21.4 10.5 17.7 10.6 13.2 C10.7 8.5 11.4 4.5 12 2 Z"/><path d="M19 3.2 C19.6 5.2 20.2 8.6 20.3 12.6 C20.4 16.5 19.7 19.6 19.1 20.8 C18.6 20 17.9 18 17.8 15.5 C17.4 10.5 18.1 6 19 3.2 Z"/></g></svg>
        <span class="app-name">PushClaw</span>
      </div>
      <div class="status" id="status-pill" title="连接状态">
        <span id="conn-dot" class="dot off"></span>
        <span id="device-label" class="muted"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="inbox">消息</button>
        <button class="tab" data-view="archive">归档</button>
        <button class="tab" data-view="send">发送</button>
        <button class="tab" data-view="settings">设置</button>
      </nav>
      <div class="header-actions">
        <button id="readall-btn" class="icon-btn" title="全部标记为已读"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></button>
        <button id="select-btn" class="icon-btn" title="多选/批量操作"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
        <button id="sync-btn" class="icon-btn" title="立即同步"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
        <button id="logout-btn" class="icon-btn" title="退出登录"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索标题 / 正文 / 应用…" />
      <div class="chips" id="priority-chips">
        <button class="chip active" data-p="">全部</button>
        <button class="chip" data-p="2">! 紧急</button>
        <button class="chip" data-p="1">↑ 高优</button>
      </div>
    </div>

    <div id="batch-bar" class="hidden">
      <span id="sel-count">已选 0 条</span>
      <div class="batch-actions">
        <button id="sel-all" class="ghost">全选</button>
        <button id="sel-archive" class="ghost">归档</button>
        <button id="sel-delete" class="danger">删除</button>
        <button id="sel-cancel" class="ghost">取消</button>
      </div>
    </div>

    <div id="emergency-bar" class="hidden"></div>
    <main id="list"></main>
    <div id="send-view" class="hidden">
      <section class="set-sec">
        <h3>新消息</h3>
        <label>标题（可选）<input id="snd-title" type="text" /></label>
        <label>正文<textarea id="snd-message" rows="4" placeholder="支持 HTML 富文本"></textarea></label>
        <label class="switch-row"><input id="snd-html" type="checkbox" /> 富文本</label>
        <label>优先级
          <select id="snd-priority">
            <option value="0">常规</option>
            <option value="1">高优</option>
            <option value="2">紧急</option>
            <option value="-1">静默</option>
          </select>
        </label>
        <label>图片附件<input id="snd-image" type="file" accept=".png,.jpg,.jpeg,.gif,.bmp,.tif,.tiff" /></label>
        <label>附加链接<input id="snd-url" type="url" placeholder="https:// 或 app:// 深链" /></label>
        <label>目标设备
          <select id="snd-device"><option value="">全部设备</option></select>
        </label>
        <div class="set-actions">
          <button id="snd-send" class="danger">发送</button>
          <span id="snd-result" class="muted small"></span>
        </div>
      </section>
    </div>
    <div id="settings-view" class="hidden">
      <section class="set-sec">
        <h3>账户</h3>
        <div class="set-row"><span class="k">设备名</span><span id="set-device" class="v"></span></div>
        <div class="set-row"><span class="k">邮箱</span><span id="set-email" class="v"></span></div>
        <div class="set-row"><span class="k">版本</span><span id="set-version" class="v"></span></div>
      </section>
      <section class="set-sec">
        <h3>通知</h3>
        <label class="switch-row"><input id="set-toast" type="checkbox" /> 收到新消息时弹出系统 Toast</label>
        <label class="switch-row"><input id="set-quiet" type="checkbox" /> 免打扰时段（紧急消息仍会提醒）</label>
        <div class="quiet-row" id="quiet-row"><input id="set-quiet-start" type="time" value="23:00" /> 至 <input id="set-quiet-end" type="time" value="08:00" /></div>
      </section>
      <section class="set-sec">
        <h3>按应用静音</h3>
        <div id="muted-list" class="muted small">在消息页出现应用后可配置</div>
      </section>
      <section class="set-sec">
        <h3>发送</h3>
        <label>API Token<input id="set-token" type="text" placeholder="30 位应用 Token" /></label>
        <label>User Key<input id="set-user" type="text" placeholder="账号 User Key" /></label>
        <div class="set-actions">
          <button id="set-save" class="ghost">保存</button>
          <button id="set-sendtest" class="ghost">发送测试消息</button>
        </div>
      </section>
    </div>
    <footer>
      <span id="count-label"></span>
      <span id="view-hint" class="muted small"></span>
      <span class="muted small">非官方 Pushover Open Client · 与 Pushover 官方无关</span>
    </footer>
  </div>

  <!-- 单条详情（便签式） -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-note">
      <div id="detail-head">
        <span id="detail-flag" class="p"></span>
        <span id="detail-title" class="t"></span>
        <time id="detail-time"></time>
        <button id="detail-close" title="关闭">✕</button>
      </div>
      <div id="detail-body"></div>
      <div id="detail-meta"></div>
      <div id="detail-actions">
        <a id="detail-url" class="hidden" href="#">打开链接 ↗</a>
        <button id="detail-ack" class="hidden urgent-btn">确认</button>
        <button id="detail-archive" class="ghost"></button>
        <button id="detail-delete" class="danger">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
