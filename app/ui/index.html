<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pushover Toolkit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="hidden">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">🐾</div>
        <h1>Pushover Toolkit</h1>
        <p class="muted">登录你的 Pushover 账号，本机将注册为一台接收设备<br>
        <span class="small">需要桌面许可 · 非官方客户端 · 凭据仅存本机</span></p>
      </div>
      <form id="login-form">
        <label>邮箱<input id="f-email" type="email" required autocomplete="username" /></label>
        <label>密码<input id="f-password" type="password" required autocomplete="current-password" /></label>
        <label>两步验证码 <span class="muted small">（开启了两步验证才填）</span>
          <input id="f-twofa" type="text" inputmode="numeric" placeholder="可选" /></label>
        <label>设备名<input id="f-device" type="text" value="mac-app" required pattern="[A-Za-z0-9_-]{1,25}" /></label>
        <div id="login-error" class="error hidden"></div>
        <button id="login-btn" type="submit">登录并注册本机</button>
      </form>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="main-view" class="hidden">
    <header>
      <div class="status">
        <span id="conn-dot" class="dot off" title="连接状态"></span>
        <span id="device-label" class="muted"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="inbox">消息</button>
        <button class="tab" data-view="archive">归档</button>
      </nav>
      <div class="header-actions">
        <button id="select-btn" class="ghost">选择</button>
        <button id="sync-btn" class="ghost">同步</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索标题 / 正文 / 应用…" />
      <div class="chips" id="priority-chips">
        <button class="chip active" data-p="">全部</button>
        <button class="chip" data-p="2">! 紧急</button>
        <button class="chip" data-p="1">↑ 高优</button>
      </div>
    </div>

    <div id="batch-bar" class="hidden">
      <span id="sel-count">已选 0 条</span>
      <div class="batch-actions">
        <button id="sel-all" class="ghost">全选</button>
        <button id="sel-archive" class="ghost">归档</button>
        <button id="sel-delete" class="danger">删除</button>
        <button id="sel-cancel" class="ghost">取消</button>
      </div>
    </div>

    <main id="list"></main>
    <footer>
      <span id="count-label"></span>
      <span id="view-hint" class="muted small"></span>
    </footer>
  </div>

  <!-- 单条详情（便签式） -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-note">
      <div id="detail-head">
        <span id="detail-flag" class="p"></span>
        <span id="detail-title" class="t"></span>
        <button id="detail-close" title="关闭">✕</button>
      </div>
      <div id="detail-body"></div>
      <div id="detail-meta"></div>
      <div id="detail-actions">
        <a id="detail-url" class="hidden" href="#">打开链接 ↗</a>
        <button id="detail-ack" class="hidden urgent-btn">确认（全设备静默）</button>
        <button id="detail-archive" class="ghost"></button>
        <button id="detail-delete" class="danger">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
